<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalLens Agent</title>
    <link rel="stylesheet" href="popup.css" />
  </head>

  <body>
    <!-- ── Header ─────────────────────────────────────── -->
    <header class="header">
      <div class="logo">
        <svg class="logo-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="8" cy="8" r="3" fill="#7c6af7"/>
          <circle cx="8" cy="8" r="7" stroke="#7c6af7" stroke-width="1" opacity="0.3"/>
        </svg>
        <span class="logo-text">LocalLens</span>
      </div>
      <div class="header-right">
        <div id="status-badge" class="badge badge--idle">Idle</div>
        <button id="close-btn" class="btn btn--icon" title="Close Widget">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"></path></svg>
        </button>
      </div>
    </header>

    <!-- ── Task input ─────────────────────────────────── -->
    <section class="task-section">
      <label class="label" for="task-input">What should the agent do?</label>
      <div class="input-row">
        
        <!-- Upload Icon (Placeholder) -->
        <button id="upload-btn" class="btn btn--icon" title="Upload Image (Coming Soon)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        </button>

        <input
          id="task-input"
          class="task-input"
          type="text"
          placeholder='e.g. "Submit the login form"'
          autocomplete="off"
          spellcheck="false"
        />

        <!-- Voice Icon (Placeholder) -->
        <button id="voice-btn" class="btn btn--icon" title="Voice Input (Coming Soon)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
        </button>

        <button id="start-btn" class="btn btn--primary">Start</button>
        <!-- Stop button temporarily hidden unless running, controlled by JS -->
        <button id="stop-btn" class="btn btn--danger" style="display:none;" disabled>Stop</button>
      </div>
    </section>

    <!-- ── Privacy indicator strip ───────────────────── -->
    <section id="privacy-strip" class="privacy-strip hidden">
      <span class="privacy-label">🔒 Redacted before sending:</span>
      <div id="redaction-tags" class="redaction-tags"></div>
    </section>

    <!-- ── Autofill Settings ─────────────────────────── -->
    <section class="settings-section" style="margin: 16px; padding: 12px; background: #1e1e1e; border-radius: 8px;">
      <div class="log-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <span class="label" style="font-weight: bold; color: #fff;">Autofill Cache</span>
        <button id="clear-cache-btn" class="btn btn--danger btn--sm">Clear All</button>
      </div>
      <div style="margin-bottom: 8px; color: #ccc;">
        <label style="display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" id="autofill-enable-cb"> Enable Local Autofill
        </label>
      </div>
      <div style="margin-bottom: 12px; color: #ccc;">
        <label style="display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" id="autofill-confirm-cb"> Require Confirmation
        </label>
      </div>
      <ul id="cache-list" class="log-list" style="max-height: 100px; overflow-y: auto; background: #000; border-radius: 4px; padding: 8px;">
      </ul>
    </section>

    <!-- ── Live action log ────────────────────────────── -->
    <section class="log-section">
      <div class="log-header">
        <span class="label">Agent log</span>
        <button id="clear-btn" class="btn btn--ghost btn--sm">Clear</button>
      </div>
      <ul id="log-list" class="log-list">
        <li class="log-entry log-entry--info log-entry--placeholder">
          Agent output will appear here…
        </li>
      </ul>
    </section>

    <!-- ── Ask-user prompt (hidden by default) ────────── -->
    <div id="ask-user-overlay" class="overlay hidden">
      <div class="overlay-card">
        <p id="ask-user-message" class="overlay-msg"></p>
        <div class="overlay-actions">
          <input id="ask-user-input" class="task-input" type="text" placeholder="Your answer…" />
          <button id="ask-user-submit" class="btn btn--primary">Send</button>
        </div>
      </div>
    </div>

    <script type="module" src="popup.ts"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalLens Agent</title>
    <link rel="stylesheet" href="popup.css" />
  </head>

  <body>
    <div class="widget">
      <!-- ── Header ─────────────────────────────────────── -->
      <header class="header">
        <div class="logo">
          <svg class="logo-icon" width="18" height="18" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="8" cy="8" r="3" fill="#8b7bf8"/>
            <circle cx="8" cy="8" r="7" stroke="#8b7bf8" stroke-width="1" opacity="0.35"/>
          </svg>
          <span class="logo-text">LocalLens</span>
        </div>
        <div class="header-right">
          <span id="status-badge" class="badge badge--idle">
            <span class="badge-dot" aria-hidden="true"></span>
            <span class="badge-label">Idle</span>
          </span>
          <button id="close-btn" class="btn btn--icon" title="Close widget" aria-label="Close widget">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"></path></svg>
          </button>
        </div>
      </header>

      <div class="widget-body">
        <!-- ── Task input ─────────────────────────────────── -->
        <section class="section task-section">
          <label class="label" for="task-input">What should the agent do?</label>
          <div class="input-row">
            <button id="upload-btn" class="btn btn--icon" title="Upload image (coming soon)" aria-label="Upload image, coming soon" disabled>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
            </button>

            <input
              id="task-input"
              class="task-input"
              type="text"
              placeholder='e.g. &quot;Submit the login form&quot;'
              autocomplete="off"
              spellcheck="false"
            />

        <!-- Voice Icon (Placeholder) -->
        <button id="voice-btn" class="btn btn--icon" title="Voice Input">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
        </button>
            <button id="voice-btn" class="btn btn--icon" title="Voice input (coming soon)" aria-label="Voice input, coming soon" disabled>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
            </button>
          </div>

          <div class="action-row">
            <button id="start-btn" class="btn btn--primary">Start</button>
            <button id="stop-btn" class="btn btn--danger" style="display:none;" disabled>Stop</button>
          </div>
        </section>

        <!-- ── Privacy indicator strip ───────────────────── -->
        <section id="privacy-strip" class="privacy-strip hidden">
          <svg class="privacy-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <span class="privacy-label">Redacted before sending</span>
          <div id="redaction-tags" class="redaction-tags"></div>
        </section>

        <!-- ── Autofill Settings ─────────────────────────── -->
        <section class="section settings-section">
          <div class="section-header">
            <span class="section-title">Autofill cache</span>
            <button id="clear-cache-btn" class="btn btn--ghost-danger btn--sm">Clear all</button>
          </div>

          <div class="toggle-list">
            <label class="toggle-row" for="autofill-enable-cb">
              <span class="toggle-text">
                <span class="toggle-title">Enable local autofill</span>
                <span class="toggle-hint">Fill saved fields without leaving this device</span>
              </span>
              <span class="switch">
                <input type="checkbox" id="autofill-enable-cb" />
                <span class="switch-track" aria-hidden="true"></span>
              </span>
            </label>

            <label class="toggle-row" for="autofill-confirm-cb">
              <span class="toggle-text">
                <span class="toggle-title">Require confirmation</span>
                <span class="toggle-hint">Ask before each autofill runs</span>
              </span>
              <span class="switch">
                <input type="checkbox" id="autofill-confirm-cb" />
                <span class="switch-track" aria-hidden="true"></span>
              </span>
            </label>
          </div>

          <ul id="cache-list" class="cache-list">
            <li class="cache-entry cache-entry--placeholder">No cached fields yet.</li>
          </ul>
        </section>

        <!-- ── Live action log ────────────────────────────── -->
        <section class="section log-section">
          <div class="section-header">
            <span class="section-title">Agent log</span>
            <button id="clear-btn" class="btn btn--ghost btn--sm">Clear</button>
          </div>
          <ul id="log-list" class="log-list">
            <li class="log-entry log-entry--info log-entry--placeholder">
              Agent output will appear here.
            </li>
          </ul>
        </section>
      </div>
    </div>

    <!-- ── Ask-user prompt (hidden by default) ────────── -->
    <div id="ask-user-overlay" class="overlay hidden">
      <div class="overlay-card" role="dialog" aria-modal="true" aria-labelledby="ask-user-message">
        <p id="ask-user-message" class="overlay-msg"></p>
        <div class="overlay-actions">
          <input id="ask-user-input" class="task-input" type="text" placeholder="Your answer…" />
          <button id="ask-user-submit" class="btn btn--primary">Send</button>
        </div>
      </div>
    </div>

    <script type="module" src="popup.ts"></script>
  </body>
</html>
